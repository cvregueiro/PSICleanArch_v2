  <path d="M348.6,335.0 Q210.3,723.7 497.4,1020.0" fill="none" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/>
  <circle cx="316.6" cy="700.6" r="10" fill="#c62828"/><text x="316.6" y="705.1" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <path d="M500.0,579.0 Q662.8,799.5 500.0,1020.0" fill="none" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/>
