  <text x="500.0" y="571" text-anchor="middle" fill="#546e7a" font-size="12.5">Artist · SearchArtists</text>
  <text x="500.0" y="590" text-anchor="middle" fill="#546e7a" font-size="12.5">SetList · Venue · City…</text>
  <text x="500.0" y="609" text-anchor="middle" font-style="italic" fill="#607d8b" font-size="12">modelos JSON con Gson</text>
