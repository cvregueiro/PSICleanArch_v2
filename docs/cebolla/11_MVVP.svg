<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1297" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Rama 11 · MVVP (UiModels) en la arquitectura en cebolla</title>
