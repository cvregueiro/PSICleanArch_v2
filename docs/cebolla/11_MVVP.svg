  <path d="M349.8,843.0 Q479.2,742.4 493.5,579.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <rect x="430.9" y="716.7" width="39.0" height="15" rx="4" fill="#ffffff" fill-opacity="0.85"/><text x="450.4" y="728.2" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2e7d32">mapea</text>
  <text x="40" y="1102" font-size="15" font-weight="700" fill="#263238">Leyenda</text>
  <rect x="40.0" y="1111" width="144.5" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="112.2" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">Nuevo en esta rama</text>
  <rect x="210.5" y="1111" width="169.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="295.1" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5">Modificado en esta rama</text>
  <text x="446.5" y="1124" text-anchor="middle" fill="#546e7a" font-size="12.5">Ya existía</text>
  <line x1="513.25" y1="1120" x2="553.25" y2="1120" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/><text x="563.25" y="1124" font-size="12.5" fill="#263238">Incumple la regla</text>
  <line x1="683.25" y1="1120" x2="723.25" y2="1120" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/><text x="733.25" y="1124" font-size="12.5" fill="#263238">Dependencia hacia dentro</text>
  <text x="40" y="1158" font-size="15" font-weight="700" fill="#c62828">Dependencias que apuntan hacia fuera</text>
  <circle cx="49" cy="1176" r="9" fill="#c62828"/><text x="49" y="1180" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text><text x="66" y="1180" font-size="13" fill="#263238">Los presenters siguen llamando a las APIs Retrofit de la capa de datos.</text>
  <circle cx="49" cy="1198" r="9" fill="#c62828"/><text x="49" y="1202" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text><text x="66" y="1202" font-size="13" fill="#263238">Los presenters siguen construyendo Retrofit y OkHttp y leyendo BuildConfig.</text>
  <circle cx="49" cy="1220" r="9" fill="#c62828"/><text x="49" y="1224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text><text x="66" y="1224" font-size="13" fill="#263238">Los modelos del paquete domain siguen siendo el JSON de las APIs (Gson).</text>
  <text x="40" y="1246" font-size="13.5" font-weight="700" fill="#c62828">✘ La UI ya está desacoplada del JSON, pero la presentación sigue accediendo a la red.</text>
  <text x="40" y="1267" font-size="13" fill="#37474f">Un único módulo Gradle (:app): las capas son solo paquetes.</text>
</svg>
