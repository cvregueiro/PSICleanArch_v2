  <text x="325.8" y="306" text-anchor="middle" fill="#1a1a1a" font-size="12.5">presenter: ArtistsView · GigsView · TaskRunner</text>
  <text x="512" y="262" text-anchor="start" font-size="14" font-weight="700" fill="#22773a">DATOS · :app</text>
  <rect x="512.0" y="272" width="238.7" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="631.4" y="285" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">repository: ArtistRepositoryImp</text>
  <rect x="512.0" y="293" width="217.0" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="620.5" y="306" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">repository: GigRepositoryImp</text>
  <rect x="291.8" y="825" width="196.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="389.9" y="838" text-anchor="middle" fill="#1a1a1a" font-size="12.5">uimodel: UiModels + mappers</text>
  <rect x="512.0" y="825" width="250.3" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="637.1" y="838" text-anchor="middle" fill="#1a1a1a" font-size="12.5">api: APIs Retrofit · DTOs + mappers</text>
  <rect x="512.0" y="846" width="311.2" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="667.6" y="859" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">api: ApiFactory (recibe la configuración)</text>
