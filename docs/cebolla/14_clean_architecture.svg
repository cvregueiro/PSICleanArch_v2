  <text x="500.0" y="440" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">usecase: SearchArtistsUseCase</text>
  <rect x="387.9" y="447" width="224.2" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="500.0" y="460" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">usecase: GetArtistGigsUseCase</text>
  <text x="500" y="718" text-anchor="middle" font-size="14" font-weight="700" fill="#6b3d00">PUERTOS (interfaces)</text>
  <rect x="391.5" y="727" width="217.0" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="500.0" y="740" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">repository: ArtistRepository</text>
  <rect x="402.4" y="747" width="195.2" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="500.0" y="760" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">repository: GigRepository</text>
  <text x="500" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#5a2a00">ENTIDADES · :app</text>
  <rect x="428.9" y="558" width="142.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="500.0" y="571" text-anchor="middle" fill="#1a1a1a" font-size="12.5">model: Artist · Gig</text>
  <rect x="406.0" y="577" width="188.0" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="500.0" y="590" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">DataUnavailableException</text>
  <rect x="418.8" y="596" width="162.5" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="500.0" y="609" text-anchor="middle" fill="#1a1a1a" font-size="12.5">ConfigurationException</text>
  <path d="M627.9,293.0 Q793.2,574.2 503.5,724.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <rect x="644.4" y="531.3" width="70.1" height="15" rx="4" fill="#ffffff" fill-opacity="0.85"/><text x="679.4" y="542.8" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2e7d32">implementa</text>
  <path d="M617.3,314.0 Q719.1,571.2 503.2,744.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <path d="M329.9,293.0 Q376.8,395.4 485.7,424.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <rect x="379.0" y="366.9" width="26.6" height="15" rx="4" fill="#ffffff" fill-opacity="0.85"/><text x="392.3" y="378.4" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2e7d32">usa</text>
  <text x="40" y="1102" font-size="15" font-weight="700" fill="#263238">Leyenda</text>
  <rect x="40.0" y="1111" width="144.5" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="112.2" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">Nuevo en esta rama</text>
  <rect x="210.5" y="1111" width="169.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="295.1" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5">Modificado en esta rama</text>
  <text x="446.5" y="1124" text-anchor="middle" fill="#546e7a" font-size="12.5">Ya existía</text>
  <line x1="513.25" y1="1120" x2="553.25" y2="1120" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/><text x="563.25" y="1124" font-size="12.5" fill="#263238">Incumple la regla</text>
  <line x1="683.25" y1="1120" x2="723.25" y2="1120" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/><text x="733.25" y="1124" font-size="12.5" fill="#263238">Dependencia hacia dentro</text>
  <text x="40" y="1158" font-size="13.5" font-weight="700" fill="#2e7d32">✔ Ninguna dependencia apunta hacia fuera: el dominio solo importa java.* y sus propias clases.</text>
  <text x="40" y="1179" font-size="13.5" font-weight="700" fill="#2e7d32">   Pero solo se cumple por disciplina: nada impide importar Retrofit en domain.</text>
  <text x="40" y="1200" font-size="13" fill="#37474f">Un único módulo Gradle (:app): las capas son solo paquetes.</text>
  <text x="40" y="1220" font-size="13" fill="#37474f">Eliminado: ArtistService(Imp), GigService(Imp), ArtistDatasource(Imp).</text>
</svg>
