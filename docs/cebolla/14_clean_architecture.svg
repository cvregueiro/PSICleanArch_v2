  <text x="500.0" y="126" text-anchor="middle" fill="#1a1a1a" font-size="12.5">ui: Activities · BaseActivity · adaptadores</text>
  <rect x="297.2" y="133" width="405.5" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="500.0" y="146" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">GlobalApplication + di.AppContainer (composition root)</text>
  <text x="500.0" y="1036" text-anchor="middle" fill="#546e7a" font-size="12.5">Retrofit · OkHttp · Gson</text>
  <text x="500.0" y="1056" text-anchor="middle" fill="#546e7a" font-size="12.5">API REST de MusicBrainz · API REST de setlist.fm</text>
  <text x="488" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#1f4fbf">PRESENTACIÓN · :app</text>
