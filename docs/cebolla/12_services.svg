  <rect x="210.5" y="1111" width="169.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="295.1" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5">Modificado en esta rama</text>
  <text x="446.5" y="1124" text-anchor="middle" fill="#546e7a" font-size="12.5">Ya existía</text>
  <line x1="513.25" y1="1120" x2="553.25" y2="1120" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/><text x="563.25" y="1124" font-size="12.5" fill="#263238">Incumple la regla</text>
  <line x1="683.25" y1="1120" x2="723.25" y2="1120" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/><text x="733.25" y="1124" font-size="12.5" fill="#263238">Dependencia hacia dentro</text>
  <text x="40" y="1158" font-size="15" font-weight="700" fill="#c62828">Dependencias que apuntan hacia fuera</text>
  <circle cx="49" cy="1176" r="9" fill="#c62828"/><text x="49" y="1180" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text><text x="66" y="1180" font-size="13" fill="#263238">ArtistServiceImp (dominio) llama a MusicBrainzAPI y usa los DTOs de la capa de datos.</text>
  <circle cx="49" cy="1198" r="9" fill="#c62828"/><text x="49" y="1202" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text><text x="66" y="1202" font-size="13" fill="#263238">GigServiceImp (dominio) construye Retrofit y OkHttp y lee BuildConfig.</text>
  <text x="40" y="1224" font-size="13.5" font-weight="700" fill="#c62828">✘ El dominio existe, pero los servicios todavía dependen de la capa de datos y de Retrofit.</text>
  <text x="40" y="1245" font-size="13" fill="#37474f">Un único módulo Gradle (:app): las capas son solo paquetes.</text>
  <text x="40" y="1265" font-size="13" fill="#37474f">Eliminado: los modelos JSON del paquete domain (pasan a data como DTOs).</text>
</svg>
