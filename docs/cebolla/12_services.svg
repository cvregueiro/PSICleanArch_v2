<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1295" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Rama 12 · Servicios en la arquitectura en cebolla</title>
