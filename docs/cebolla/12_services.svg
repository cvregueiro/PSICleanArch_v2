  <circle cx="374.9" cy="754.0" r="10" fill="#c62828"/><text x="374.9" y="758.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
  <path d="M365.9,314.0 Q406.3,391.1 486.8,424.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <rect x="403.0" y="370.0" width="26.6" height="15" rx="4" fill="#ffffff" fill-opacity="0.85"/><text x="416.3" y="381.5" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2e7d32">usa</text>
  <path d="M622.4,843.0 Q506.3,736.5 505.3,579.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <rect x="515.5" y="713.8" width="39.0" height="15" rx="4" fill="#ffffff" fill-opacity="0.85"/><text x="535.1" y="725.3" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2e7d32">mapea</text>
  <text x="40" y="1102" font-size="15" font-weight="700" fill="#263238">Leyenda</text>
  <rect x="40.0" y="1111" width="144.5" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
