  <circle cx="500" cy="600" r="95" fill="#ffc98a" stroke="#d27a10" stroke-width="2"/>
  <line x1="500" y1="190" x2="500" y2="385" stroke="#78909c" stroke-dasharray="5,4"/>
  <line x1="500" y1="815" x2="500" y2="1010" stroke="#78909c" stroke-dasharray="5,4"/>
  <text x="500" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#37474f">FRAMEWORKS Y DRIVERS</text>
  <text x="500.0" y="126" text-anchor="middle" fill="#546e7a" font-size="12.5">Android SDK · RecyclerView · layouts</text>
  <rect x="347.9" y="133" width="304.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="500.0" y="146" text-anchor="middle" fill="#1a1a1a" font-size="12.5">ArtistsActivity monta servicio + datasource</text>
  <text x="500.0" y="1036" text-anchor="middle" fill="#546e7a" font-size="12.5">Retrofit · OkHttp · Gson · BuildConfig</text>
  <text x="500.0" y="1056" text-anchor="middle" fill="#546e7a" font-size="12.5">API REST de MusicBrainz · API REST de setlist.fm</text>
  <text x="488" y="262" text-anchor="end" font-size="14" font-weight="700" fill="#1f4fbf">PRESENTACIÓN · :app</text>
  <text x="406.8" y="285" text-anchor="middle" fill="#546e7a" font-size="12.5">ArtistsView · GigsView</text>
  <text x="352.8" y="306" text-anchor="middle" fill="#546e7a" font-size="12.5">ArtistsPresenterImp · GigsPresenterImp</text>
  <text x="512" y="262" text-anchor="start" font-size="14" font-weight="700" fill="#22773a">DATOS · :app</text>
  <rect x="512.0" y="272" width="253.2" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="638.6" y="285" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">ArtistDatasourceImp (MusicBrainz)</text>
  <text x="616.9" y="306" text-anchor="middle" fill="#546e7a" font-size="12.5">MusicBrainzAPI · SetListFmAPI</text>
  <text x="586.5" y="327" text-anchor="middle" fill="#546e7a" font-size="12.5">interceptores OkHttp</text>
  <text x="420.2" y="838" text-anchor="middle" fill="#546e7a" font-size="12.5">UiModels + mappers</text>
  <text x="447.2" y="859" text-anchor="middle" fill="#546e7a" font-size="12.5">TaskRunner</text>
  <text x="566.2" y="838" text-anchor="middle" fill="#546e7a" font-size="12.5">DTOs + mappers</text>
  <text x="500" y="998" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">ADAPTADORES DE INTERFAZ</text>
  <text x="500" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#6b3d00">CASOS DE USO · :app</text>
  <text x="500.0" y="440" text-anchor="middle" fill="#546e7a" font-size="12.5">ArtistService · GigService</text>
  <rect x="395.1" y="447" width="209.8" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="500.0" y="460" text-anchor="middle" fill="#1a1a1a" font-size="12.5">ArtistServiceImp: solo reglas</text>
  <rect x="449.1" y="467" width="101.8" height="18" rx="9" fill="#ffffff" fill-opacity="0.6" stroke="#c62828" stroke-width="2"/>
  <text x="500.0" y="480" text-anchor="middle" fill="#546e7a" font-size="12.5">GigServiceImp</text>
  <text x="500" y="718" text-anchor="middle" font-size="14" font-weight="700" fill="#6b3d00">PUERTOS (interfaces)</text>
  <rect x="435.0" y="727" width="130.0" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="500.0" y="740" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">ArtistDatasource</text>
  <text x="500" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#5a2a00">ENTIDADES · :app</text>
  <text x="500.0" y="571" text-anchor="middle" fill="#546e7a" font-size="12.5">Artist · Gig</text>
  <text x="500.0" y="590" text-anchor="middle" fill="#546e7a" font-size="12.5">ConfigurationException</text>
  <path d="M500.0,488.0 Q222.0,754.0 500.0,1020.0" fill="none" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/>
  <circle cx="361.0" cy="754.0" r="10" fill="#c62828"/><text x="361.0" y="758.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
  <path d="M635.0,293.0 Q683.1,543.2 503.7,724.0" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/>
  <rect x="591.1" y="515.8" width="70.1" height="15" rx="4" fill="#ffffff" fill-opacity="0.85"/><text x="626.2" y="527.3" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2e7d32">implementa</text>
  <text x="40" y="1102" font-size="15" font-weight="700" fill="#263238">Leyenda</text>
  <rect x="40.0" y="1111" width="144.5" height="18" rx="9" fill="#fff176" stroke="#f9a825" stroke-width="1.2"/>
  <text x="112.2" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5" font-weight="700">Nuevo en esta rama</text>
  <rect x="210.5" y="1111" width="169.2" height="18" rx="9" fill="#ffffff" fill-opacity="0.75" stroke="#f9a825" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="295.1" y="1124" text-anchor="middle" fill="#1a1a1a" font-size="12.5">Modificado en esta rama</text>
  <text x="446.5" y="1124" text-anchor="middle" fill="#546e7a" font-size="12.5">Ya existía</text>
  <line x1="513.25" y1="1120" x2="553.25" y2="1120" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#bad)"/><text x="563.25" y="1124" font-size="12.5" fill="#263238">Incumple la regla</text>
  <line x1="683.25" y1="1120" x2="723.25" y2="1120" stroke="#2e7d32" stroke-width="2.4" stroke-dasharray="3,3" marker-end="url(#ok)"/><text x="733.25" y="1124" font-size="12.5" fill="#263238">Dependencia hacia dentro</text>
  <text x="40" y="1158" font-size="15" font-weight="700" fill="#c62828">Dependencias que apuntan hacia fuera</text>
  <circle cx="49" cy="1176" r="9" fill="#c62828"/><text x="49" y="1180" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text><text x="66" y="1180" font-size="13" fill="#263238">GigServiceImp (dominio) sigue construyendo Retrofit, usando los DTOs y leyendo BuildConfig.</text>
  <text x="40" y="1202" font-size="13.5" font-weight="700" fill="#c62828">✘ Los artistas ya cumplen la regla (inversión de dependencias); los bolos todavía no.</text>
  <text x="40" y="1223" font-size="13" fill="#37474f">Un único módulo Gradle (:app): las capas son solo paquetes.</text>
</svg>
