<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1253" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Rama 13 · Datasources en la arquitectura en cebolla</title>
  <defs>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect width="1000" height="1253" fill="#eceff1"/>
  <rect x="0" y="0" width="1000" height="64" fill="#37474f"/>
  <text x="500.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Rama 13 · Datasources en la arquitectura en cebolla</text>
  <text x="500.0" y="52" text-anchor="middle" font-size="13" fill="#cfd8dc">El servicio de artistas deja de saber de dónde vienen los datos</text>
  <rect x="0" y="1080" width="1000" height="1253" fill="#ffffff"/>
  <circle cx="500" cy="600" r="410" fill="#dbe8ff" stroke="#5b8def" stroke-width="2"/>
  <path d="M500,190 A410,410 0 0 1 500,1010 Z" fill="#dcf3e2" stroke="#3fa35b" stroke-width="2"/>
